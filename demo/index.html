<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'">
<title>libft Lens Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root { color-scheme: dark; --bg: #050608; --ink: #e8ebf2; --muted: #8b93a7; --accent: #7199ff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 15px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif;
    display: grid; place-items: center; gap: 16px; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
  canvas { width: min(92vw, 78vh); aspect-ratio: 1; border-radius: 14px; box-shadow: 0 30px 80px rgb(0 0 0 / .6); display: block; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
  button { font: inherit; font-weight: 700; color: var(--ink); background: #161b25; border: 1px solid #2a3140; border-radius: 9px; padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { color: var(--muted); font-size: 14px; min-height: 1.5em; text-align: center; }
  a { color: var(--accent); }
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1080" aria-label="libft Lens product intro animation"></canvas>
<div class="bar">
  <button id="play" class="primary">Play</button>
  <button id="record">Record video</button>
  <button id="poster">Save poster frame</button>
</div>
<p id="status">42 seconds, 1080 × 1080, made for the LinkedIn feed.</p>
<script src="intro.js"></script>
</body>
</html>
